{% comment %}
Under the description: its length, and the row this category will be on the
categories list. Driven by `category_form.html`.
{% endcomment %}
<div class="char-count" data-count aria-live="polite"></div>
<div class="row-preview" aria-hidden="true">
  <span class="row-preview-label">On the categories list</span>
  <div class="cell-identity">
    <span class="avatar avatar-sm avatar-square" data-preview-mark>?</span>
    <span class="cell-identity-text">
      <span class="cell-identity-name" data-preview-name>Category name</span>
      <span class="cell-sub" data-preview-sub>No description</span>
    </span>
  </div>
</div>
