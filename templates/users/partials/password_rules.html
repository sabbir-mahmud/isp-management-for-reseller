{% comment %}
Under the new password: how strong it looks, and Django's rules as a
checklist. `password-tools.js` ticks them as the reader types.
{% endcomment %}
<div class="strength" data-strength data-level="0" aria-live="polite">
  <div class="strength-bars" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <span class="strength-label" data-strength-label>Start typing</span>
</div>
<ul class="rule-list">
  {% for key, text in form.password_rules %}
    <li data-rule="{{ key }}" data-state="">{{ text }}</li>
  {% endfor %}
</ul>
