{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · {{ SITE_NAME }}</title>
  <link rel="preload" href="{% static 'fonts/nunito-sans-latin.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="login-page">
  <div class="login-card">
    <h1 class="h4 mb-1">{{ SITE_NAME }}</h1>
    <p class="text-muted small mb-4">Sign in to manage clients and billing.</p>

    <form method="post" novalidate>
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="alert alert-danger py-2 small">
          {% for error in form.non_field_errors %}<div>{{ error }}</div>{% endfor %}
        </div>
      {% endif %}
      <div class="mb-3">
        <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
        {{ form.username }}
      </div>
      <div class="mb-4">
        <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
        {{ form.password }}
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100 btn-lg" type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
